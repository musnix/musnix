name: Check

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: jlumbroso/free-disk-space@main
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: musnix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: echo "NIX_PATH=nixpkgs=https://github.com/NixOS/nixpkgs/archive/$(jq -r .nodes.nixpkgs.locked.rev flake.lock).tar.gz" >> "$GITHUB_ENV"
      - run: nix build --dry-run --file release.nix
      - run: nix flake check -L
      - name: Pin check closure in Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: scripts/cachix-pin.sh musnix
