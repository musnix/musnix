name: Check

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: musnix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: echo "NIX_PATH=nixpkgs=https://github.com/NixOS/nixpkgs/archive/$(jq -r .nodes.nixpkgs.locked.rev flake.lock).tar.gz" >> "$GITHUB_ENV"
      - run: nix build --dry-run --file release.nix
      - run: nix flake check -L
      - name: Pin check closure in Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: scripts/cachix-pin.sh musnix
